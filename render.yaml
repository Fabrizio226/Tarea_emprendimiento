services:
  - type: web
    name: lumenia
    runtime: static
    buildCommand: >-
      mkdir -p _site &&
      cp index.html agendar-hora.html cancelar-hora.html preguntas.html horarios.html ayuda.html _site/ &&
      cp -R static _site/ &&
      touch _site/.nojekyll
    staticPublishPath: ./_site
